<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VP OIL STORE | Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Poppins,Arial;
background:#0f2027;
display:flex;
justify-content:center;
}
.container{
background:#fff;
width:95%;
max-width:600px;
padding:25px;
border-radius:20px;
margin-top:20px;
}
.btn{
width:100%;
padding:12px;
border:none;
border-radius:25px;
background:#2c5364;
color:white;
margin-top:10px;
cursor:pointer;
}
input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
}
.info{background:#f1f1f1;padding:10px;border-radius:10px;margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<h2 id="productTitle">🛒 Product : Not Selected</h2>

<select id="quantity" onchange="calculatePrice()">
<option value="">Select Quantity</option>
<option value="0.5">500 ml</option>
<option value="1">1 Litre</option>
<option value="2">2 Litres</option>
<option value="5">5 Litres</option>
</select>

<input id="price" readonly placeholder="Total Price">

<div class="info">
<p>Sub Total : <b id="sub">₹0</b></p>
<p>Delivery : <b id="delivery">₹0</b></p>
<p>Discount : <b id="discount">₹0</b></p>
<hr>
<p>Payable : <b id="final">₹0</b></p>
</div>

<textarea id="address" placeholder="Enter Address"></textarea>

<button class="btn" onclick="confirmOrder()">✅ Confirm Order</button>
<button class="btn" onclick="sendWhatsApp()">📲 Order via WhatsApp</button>
<button class="btn" onclick="payNow()">💳 Pay Now</button>

</div>

<script>
// PRODUCT FROM URL
const params = new URLSearchParams(window.location.search);
const product = params.get("product");

if(product){
document.getElementById("productTitle").innerHTML =
"🛒 Product : <b>"+product+"</b>";
}

// PRICE LIST
const prices = {
"Coconut Oil":480,
"Sesame Oil":390,
"Peanut Oil":220,
"Sunflower Oil":350
};

let finalPayAmount = 0;

function calculatePrice(){
const qty = Number(document.getElementById("quantity").value);
if(!product || !qty) return;

let sub = prices[product] * qty;
let delivery = sub < 500 ? 50 : 0;
let discount = sub >= 1000 ? sub * 0.1 : 0;

finalPayAmount = sub + delivery - discount;

document.getElementById("price").value = "₹"+sub;
document.getElementById("sub").innerText = "₹"+sub;
document.getElementById("delivery").innerText = "₹"+delivery;
document.getElementById("discount").innerText = "₹"+discount;
document.getElementById("final").innerText = "₹"+finalPayAmount;
}

function confirmOrder(){
if(!finalPayAmount){
alert("Select Quantity ❗");
return;
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({
orderNo: orders.length+1,
product: product,
quantity: document.getElementById("quantity").value+" L",
amount: finalPayAmount,
status:"Being Delivered"
});

localStorage.setItem("orders",JSON.stringify(orders));

alert("✅ Order Confirmed & Saved");
}

function sendWhatsApp(){
if(!finalPayAmount){alert("Select quantity");return;}
let msg =
`VP OIL STORE ORDER
Product: ${product}
Amount: ₹${finalPayAmount}`;
window.open("https://wa.me/916374693930?text="+encodeURIComponent(msg));
}

function payNow(){
if(!finalPayAmount){alert("Select quantity");return;}
let upi = `upi://pay?pa=sanmuga0006@oksbi&pn=VP OIL STORE&am=${finalPayAmount}&cu=INR`;
window.location.href = upi;
}
</script>

</body>
</html>
