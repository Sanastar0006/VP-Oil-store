<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VP OIL STORE – Premium Oils</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    padding:30px;
    color:#fff;
}
h1{text-align:center;letter-spacing:2px;}
.subtitle{text-align:center;opacity:0.8;margin-bottom:40px;}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border-radius:22px;
    padding:20px;
    text-align:center;
    box-shadow:0 25px 50px rgba(0,0,0,0.35);
    transition:0.4s;
}
.card:hover{
    transform:translateY(-10px) scale(1.03);
}

.card img{
    width:100%;
    height:240px;
    object-fit:contain;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 26px;
    border-radius:30px;
    background:linear-gradient(135deg,#ffd89b,#19547b);
    color:#000;
    font-weight:600;
    text-decoration:none;
}
.product img {
  width: 100%;
  max-width: 220px;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<h1>VP OIL STORE</h1>
<p class="subtitle">Pure • Cold Pressed • Luxury Oils</p>

<div class="grid">

<div class="card">
<img src="sunflower-oil.jpg" alt="Sunflower Oil">
<h3>Sunflower Oil</h3>
<a href="Addrass.html?product=Sunflower Oil" class="btn">Order Now</a>
</div>

<div class="card">
<img src="sesame-oil.jpg" alt="Sesame Oil">
<h3>Sesame Oil</h3>
<a href="Addrass.html?product=Sesame Oil" class="btn">Order Now</a>
</div>

<div class="card">
<img src="peanut-oil.jpg" alt="Peanut Oil">
<h3>Peanut Oil</h3>
<a href="Addrass.html?product=Peanut Oil" class="btn">Order Now</a>
</div>

<div class="card">
<img src="coconut-oil.jpg" alt="Coconut Oil">
<h3>Coconut Oil</h3>
<a href="Addrass.html?product=Coconut Oil" class="btn">Order Now</a>
</div>

</div>

</body>
</html>
