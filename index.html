<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VP OIL STORE – Pure Luxury Oils</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    padding:30px;
    color:#fff;
}
h1{
    text-align:center;
    margin-bottom:10px;
    letter-spacing:2px;
}
.subtitle{
    text-align:center;
    opacity:0.8;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
}

.card{
    backdrop-filter: blur(12px);
    background:rgba(255,255,255,0.12);
    border-radius:22px;
    padding:20px;
    text-align:center;
    box-shadow:0 25px 50px rgba(0,0,0,0.35);
    transition:0.4s;
}
.card:hover{
    transform:translateY(-10px) scale(1.02);
    box-shadow:0 40px 80px rgba(0,0,0,0.45);
}

.card img{
    width:100%;
    height:260px;
    object-fit:contain;
    border-radius:15px;
}

.card h3{
    margin:15px 0 5px;
    font-weight:600;
    letter-spacing:1px;
}

.badge{
    font-size:12px;
    background:gold;
    color:#000;
    padding:4px 10px;
    border-radius:20px;
    display:inline-block;
    margin-bottom:10px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 26px;
    border-radius:30px;
    text-decoration:none;
    background:linear-gradient(135deg,#ffd89b,#19547b);
    color:#000;
    font-weight:600;
    transition:0.3s;
}
.btn:hover{
    transform:scale(1.08);
}
.footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    opacity:0.6;
}
</style>
</head>

<body>

<h1>VP OIL STORE</h1>
<p class="subtitle">Pure • Cold Pressed • Luxury Oils</p>

<div class="grid" id="productGrid"></div>

<div class="footer">
© 2026 VP OIL STORE — Premium Quality Promise
</div>

<script>
const images = [
  "Sunflower oil.jpg.jpeg",
  "Sesame oil.jpg.jpeg",
  "Peanut oil.jpg.jpeg",
  "Cocunutoil.jpg.jpeg"
];

function getProductName(file){
    return file
        .replace(".jpg.jpeg","")
        .replace(/oil/i," Oil")
        .replace(/_/g," ")
        .trim();
}

const grid = document.getElementById("productGrid");

images.forEach(img=>{
    const product = getProductName(img);

    grid.innerHTML += `
    <div class="card">
        <span class="badge">PREMIUM</span>
        <img src="images/${img}">
        <h3>${product}</h3>
        <a class="btn" href="order.html?product=${encodeURIComponent(product)}">
            Order Now
        </a>
    </div>`;
});
</script>

</body>
</html>
